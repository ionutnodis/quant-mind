[project]
name = "quantmind"
version = "0.1.0"
description = "Personal IBKR macro cockpit and options-aware portfolio risk engine"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pyarrow>=16",
    "duckdb>=1.0",
    "pydantic-settings>=2.3",
    "ib_async>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36", "plotly>=5.22"]
macro = ["fredapi>=0.5"]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: opt-in tests requiring a live IB Gateway paper-account session (deselected by default)",
]
addopts = "-m 'not e2e'"
