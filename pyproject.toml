[project]
name = "quantmind"
version = "0.5.0.0"
description = "Personal IBKR macro cockpit and options-aware portfolio risk engine"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "defusedxml>=0.7.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pyarrow>=16",
    "duckdb>=1.0",
    "pydantic-settings>=2.3",
    "ib_async>=1.0",
    "certifi>=2026.7.22",
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.51.0",
    "yfinance>=1.5.2",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36", "plotly>=5.22"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: opt-in tests requiring a live IB Gateway paper-account session (deselected by default)",
]
addopts = "-m 'not e2e'"
