name: CI

on:
  pull_request:
  push:
    branches: [main, factor-risk-dashboard-product]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --locked --dev
      - name: Run backend and contract tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: |
          uv sync --locked
          cd web
          bun install --frozen-lockfile
      - name: Verify generated API types
        working-directory: web
        run: |
          bun run gen:types
          git diff --exit-code -- src/lib/api-types.ts
      - name: Lint, test, and build frontend
        working-directory: web
        run: |
          bun run lint
          bunx vitest run
          bun run build
      - name: Install Playwright browsers
        working-directory: web
        run: bunx playwright install --with-deps chromium webkit
      - name: Run hermetic browser smoke tests
        working-directory: web
        run: bunx playwright test
